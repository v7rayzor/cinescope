  <!-- Fond noir discret arrondi officiel -->
  <rect width="240" height="160" rx="16" fill="#000000" />

  <!-- Texte prime en blanc -->
  <text x="120" y="74" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5" text-anchor="middle">prime</text>

  <!-- Texte video en blanc doux -->
  <text x="120" y="112" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#00a8e1" letter-spacing="4" text-anchor="middle">VIDEO</text>

  <!-- Sourire / flèche emblématique Prime en bleu cyan officiel (#00a8e1) -->
