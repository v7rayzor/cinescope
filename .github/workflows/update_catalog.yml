name: Auto Update JustWatch Catalog

on:
  schedule:
    # Exécution quotidienne à 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Déclenchement manuel en 1 clic depuis l'onglet Actions

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Synchroniser le catalogue JustWatch
        run: node scripts/sync_justwatch.js

      - name: Valider et publier les mises à jour
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/catalog.js
          git diff --staged --quiet || (git commit -m "chore(catalog): auto-update JustWatch streaming catalog [skip ci]" && git push)
