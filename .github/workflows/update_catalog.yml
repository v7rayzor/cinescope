name: Auto Update JustWatch Catalog

on:
  schedule:
    # Exécution quotidienne à 06:00 UTC (bouquets payants de référence : OCS, Action Max, Universal+)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      include_specialized:
        description: 'Inclure les chaînes spécialisées (Sooner, Shadowz, Insomnia)'
        type: boolean
        default: false

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Synchroniser le catalogue JustWatch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ inputs.include_specialized }}" = "true" ]; then
            node scripts/sync_justwatch.cjs --specialized
          else
            node scripts/sync_justwatch.cjs
          fi

      - name: Valider et publier les mises à jour
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/catalog.js data/ai_duel_cache.json
          git diff --staged --quiet || (git commit -m "chore(catalog): auto-update JustWatch streaming catalog [skip ci]" && git push)
